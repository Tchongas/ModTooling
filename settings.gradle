import groovy.json.JsonSlurper

def toolingDir = settings.providers.gradleProperty('modToolingDir').orElse(settings.providers.environmentVariable('MOD_TOOLING_HOME')).getOrElse('../ModTooling')
def tooling = settings.settingsDir.toPath().resolve(toolingDir).toFile()
def python = settings.providers.environmentVariable('MOD_TOOLING_PYTHON').getOrElse('python')

def config
try {
    def result = settings.providers.exec {
        commandLine python, new File(tooling, 'modtool.py').absolutePath, '--project', settings.settingsDir.absolutePath, 'emit-config'
    }
    config = new JsonSlurper().parseText(result.standardOutput.asText.get())
} catch (Exception e) {
    throw new GradleException("Failed to load project config via ModTooling (${e.message}). Install Python 3.11+ or set MOD_TOOLING_PYTHON.", e)
}
if (!new File(tooling, 'VERSION').isFile() || new File(tooling, 'VERSION').text.trim() != config.tooling_version) {
    throw new GradleException("ModTooling ${config.tooling_version} required. Set MOD_TOOLING_HOME or -PmodToolingDir to its checkout.")
}
gradle.beforeProject { p ->
    config.build.each { key, value -> p.ext.set(key, value) }
    p.version = config.build.version
    p.group = config.build.group
    p.description = config.build.description
    p.ext.modToolingHome = tooling
    p.ext.modConfig = config
}
config.loaders.each { loader, module -> settings.include(module) }
